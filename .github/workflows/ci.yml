name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Set up Cachix
        uses: cachix/cachix-action@v15
        with:
          name: ttak0422
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Flake checks
        run: nix flake check

      # -coverpkg=./... credits a package for the lines any test reaches, not just its own tests.
      # The CLI tests drive the engine packages end to end, so per-package coverage reads far lower
      # than the code is actually exercised.
      - name: Go tests
        run: nix develop --command go test -coverpkg=./... -coverprofile=coverage.out ./...

      # The comment on a PR reports per package; the per-function table has no other home, so it goes
      # to the job summary.
      - name: Go coverage
        run: |
          nix develop --command go tool cover -func=coverage.out >coverage-func.txt
          {
            awk 'END { print "**" $3 "** of statements covered" }' coverage-func.txt
            echo
            echo "<details><summary>Per function</summary>"
            echo
            echo '```'
            cat coverage-func.txt
            echo '```'
            echo
            echo "</details>"
          } >>"$GITHUB_STEP_SUMMARY"

      # The report job reads this back with `gh run download`, and reads the same artifact from the
      # last main run to work out the delta — so the upload has to happen on push to main too.
      - name: Upload coverage profile
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage
          path: coverage.out
          if-no-files-found: error

      - name: Neovim action-link E2E
        run: |
          export TRACK_VAULT="$(mktemp -d)"
          export TRACK_CACHE_DIR="$(mktemp -d)"
          nix run .#test-nvim -- --headless '+luafile scripts/e2e/nvim_action_links.lua'

      - name: Neovim link keymap E2E
        run: |
          export TRACK_VAULT="$(mktemp -d)"
          export TRACK_CACHE_DIR="$(mktemp -d)"
          nix run .#test-nvim -- --headless '+luafile scripts/e2e/nvim_link_keymap.lua'

      - name: Neovim template picker E2E
        run: |
          export TRACK_VAULT="$(mktemp -d)"
          export TRACK_CACHE_DIR="$(mktemp -d)"
          nix run .#test-nvim -- --headless '+luafile scripts/e2e/nvim_telescope_templates.lua'

      - name: Neovim search order E2E
        run: |
          export TRACK_VAULT="$(mktemp -d)"
          export TRACK_CACHE_DIR="$(mktemp -d)"
          nix run .#test-nvim -- --headless '+luafile scripts/e2e/nvim_telescope_search_order.lua'

      - name: Neovim Babel visibility E2E
        run: |
          export TRACK_VAULT="$(mktemp -d)"
          export TRACK_CACHE_DIR="$(mktemp -d)"
          nix run .#test-nvim -- --headless '+luafile scripts/e2e/nvim_babel_visibility.lua'

      - name: Neovim graph E2E
        run: |
          export TRACK_VAULT="$(mktemp -d)"
          export TRACK_CACHE_DIR="$(mktemp -d)"
          nix run .#test-nvim -- --headless '+luafile scripts/e2e/nvim_graph.lua'

      - name: Neovim backlinks E2E
        run: |
          export TRACK_VAULT="$(mktemp -d)"
          export TRACK_CACHE_DIR="$(mktemp -d)"
          nix run .#test-nvim -- --headless '+luafile scripts/e2e/nvim_backlinks.lua'

      - name: Neovim On this day E2E
        run: |
          export TRACK_VAULT="$(mktemp -d)"
          export TRACK_CACHE_DIR="$(mktemp -d)"
          nix run .#test-nvim -- --headless '+luafile scripts/e2e/nvim_on_this_day.lua'

      - name: Neovim meta editor E2E
        run: |
          export TRACK_VAULT="$(mktemp -d)"
          export TRACK_CACHE_DIR="$(mktemp -d)"
          nix run .#test-nvim -- --headless '+luafile scripts/e2e/nvim_meta.lua'

      - name: Neovim task conceal E2E
        run: |
          export TRACK_VAULT="$(mktemp -d)"
          export TRACK_CACHE_DIR="$(mktemp -d)"
          nix run .#test-nvim -- --headless '+luafile scripts/e2e/nvim_task_conceal.lua'

  # Reads this run's coverage profile and the one from the last main run, and comments the per-package
  # table and the change against main. Forks and Dependabot get no token that can comment, so they are
  # left out rather than failed. Runs without Nix: the action ships its own binary.
  #
  # The report covers the packages whose Go files this PR changed, so a docs-only or workflow-only PR
  # gets no comment at all — that is the action working, not a broken run. The job summary in `test`
  # still carries the whole picture.
  coverage_report:
    name: Coverage report
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: write

    steps:
      - name: Report coverage on the PR
        uses: fgrosse/go-coverage-report@v1.3.1
        with:
          coverage-file-name: coverage.out
          trim: github.com/ttak0422/track/
