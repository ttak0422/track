name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Set up Cachix
        uses: cachix/cachix-action@v15
        with:
          name: ttak0422
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Flake checks
        run: nix flake check

      # -coverpkg=./... credits a package for the lines any test reaches, not just its own tests.
      # The CLI tests drive the engine packages end to end, so per-package coverage reads far lower
      # than the code is actually exercised.
      - name: Go tests
        run: nix develop --command go test -coverpkg=./... -coverprofile=coverage.out ./...

      - name: Go coverage
        run: |
          nix develop --command go tool cover -func=coverage.out >coverage.txt
          echo "COVERAGE_TOTAL=$(awk 'END { print $3 }' coverage.txt)" >>"$GITHUB_ENV"
          {
            awk 'END { print "**" $3 "** of statements covered" }' coverage.txt
            echo
            echo "<details><summary>Per function</summary>"
            echo
            echo '```'
            cat coverage.txt
            echo '```'
            echo
            echo "</details>"
          } >>"$GITHUB_STEP_SUMMARY"

      # The per-function table is too big for a comment, so the comment carries the total and links to
      # the summary that holds the table. Skipped for forks and Dependabot, whose token cannot comment.
      - name: Comment coverage on the PR
        if: >-
          github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.full_name == github.repository
          && github.actor != 'dependabot[bot]'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          scripts/pr-comment.sh go-coverage "$PR" \
            "Go coverage: **$COVERAGE_TOTAL** of statements — [per-function breakdown]($RUN_URL)"

      - name: Neovim action-link E2E
        run: |
          export TRACK_VAULT="$(mktemp -d)"
          export TRACK_CACHE_DIR="$(mktemp -d)"
          nix run .#test-nvim -- --headless '+luafile scripts/e2e/nvim_action_links.lua'

      - name: Neovim link keymap E2E
        run: |
          export TRACK_VAULT="$(mktemp -d)"
          export TRACK_CACHE_DIR="$(mktemp -d)"
          nix run .#test-nvim -- --headless '+luafile scripts/e2e/nvim_link_keymap.lua'

      - name: Neovim template picker E2E
        run: |
          export TRACK_VAULT="$(mktemp -d)"
          export TRACK_CACHE_DIR="$(mktemp -d)"
          nix run .#test-nvim -- --headless '+luafile scripts/e2e/nvim_telescope_templates.lua'

      - name: Neovim search order E2E
        run: |
          export TRACK_VAULT="$(mktemp -d)"
          export TRACK_CACHE_DIR="$(mktemp -d)"
          nix run .#test-nvim -- --headless '+luafile scripts/e2e/nvim_telescope_search_order.lua'

      - name: Neovim Babel visibility E2E
        run: |
          export TRACK_VAULT="$(mktemp -d)"
          export TRACK_CACHE_DIR="$(mktemp -d)"
          nix run .#test-nvim -- --headless '+luafile scripts/e2e/nvim_babel_visibility.lua'

      - name: Neovim graph E2E
        run: |
          export TRACK_VAULT="$(mktemp -d)"
          export TRACK_CACHE_DIR="$(mktemp -d)"
          nix run .#test-nvim -- --headless '+luafile scripts/e2e/nvim_graph.lua'

      - name: Neovim backlinks E2E
        run: |
          export TRACK_VAULT="$(mktemp -d)"
          export TRACK_CACHE_DIR="$(mktemp -d)"
          nix run .#test-nvim -- --headless '+luafile scripts/e2e/nvim_backlinks.lua'

      - name: Neovim On this day E2E
        run: |
          export TRACK_VAULT="$(mktemp -d)"
          export TRACK_CACHE_DIR="$(mktemp -d)"
          nix run .#test-nvim -- --headless '+luafile scripts/e2e/nvim_on_this_day.lua'

      - name: Neovim meta editor E2E
        run: |
          export TRACK_VAULT="$(mktemp -d)"
          export TRACK_CACHE_DIR="$(mktemp -d)"
          nix run .#test-nvim -- --headless '+luafile scripts/e2e/nvim_meta.lua'
