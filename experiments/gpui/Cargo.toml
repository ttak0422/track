[package]
name = "track-gpui-poc"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[dependencies]
latex-rust = { version = "=3.0.3", default-features = false, features = ["png"] }
image = { version = "=0.25.9", default-features = false, features = ["png", "jpeg"] }
gpui = { path = ".build-deps/gpui", version = "=0.2.2", default-features = false, features = ["font-kit", "runtime_shaders"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
pulldown-cmark = "0.13"
unicase = "=2.10.0"
regex = "1.13"

reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
libc = "0.2"
tokio = { version = "=1.54.1", features = ["rt", "time", "sync", "net"] }
unicode-segmentation = "=1.12.0"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "=0.26.0"
objc = "=0.2.7"
raw-window-handle = "=0.6.2"

# Generated from the hash-pinned official crate; see patches/README.md.
[patch.crates-io]
xattr = { path = ".build-deps/xattr" }

[target.'cfg(target_os = "linux")'.dev-dependencies]
xattr = "=0.2.3"
zed-async-tar = "=0.5.0-zed"
async-std = "1.12"

# Focused initial BeautifulRust checks; broader review stays opt-in.
[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
