[package]
name = "track-gpui-poc"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit", "runtime_shaders"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
pulldown-cmark = "0.13"

reqwest = { version = "0.12", default-features = false, features = ["blocking", "json"] }
libc = "0.2"
